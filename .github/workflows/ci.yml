name: Java CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testar e gerar JAR com H2
        run: bash mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: controle-gastos-jar
          path: target/controle-gastos-1.1.0.jar
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: controle_test
          MYSQL_ROOT_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testar migrações e API no MySQL
        env:
          TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/controle_test?allowPublicKeyRetrieval=true&useSSL=false
          TEST_DB_USERNAME: root
          TEST_DB_PASSWORD: ci-test-password
        run: bash mvnw -B test
